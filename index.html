<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06121d">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>NIGHTMARE — Grimório Digital</title>
  <link rel="stylesheet" href="theme.css?v=21">
  <link rel="stylesheet" href="style.css?v=21">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand"><span class="sigil">◈</span><div><small>GRIMÓRIO DIGITAL</small><h1>NIGHTMARE</h1></div></div>
    <nav class="mode-tabs" aria-label="Modo de visualização">
      <button class="tab active" data-mode="sheet">Ficha</button>
      <button class="tab" data-mode="combat">Combate</button>
    </nav>
    <div class="save-tools">
      <span id="saveStatus" class="save-status">Salvo</span>
      <button id="exportBtn" class="btn ghost">Exportar</button>
      <button id="importBtn" class="btn ghost">Importar</button>
      <button id="resetBtn" class="btn danger">Resetar</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
      <input id="characterPhotoFile" type="file" accept="image/png,image/jpeg,image/webp" hidden>
    </div>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <div id="toastRegion" class="toasts" aria-live="assertive"></div>
  <dialog id="confirmDialog">
    <form method="dialog" class="dialog-card">
      <h2 id="dialogTitle">Confirmar</h2><p id="dialogText"></p>
      <div class="dialog-actions"><button value="cancel" class="btn ghost">Cancelar</button><button value="confirm" class="btn danger">Confirmar</button></div>
    </form>
  </dialog>
  <dialog id="executeDialog" class="execute-dialog">
    <form method="dialog" class="dialog-card execute-card">
      <div id="executeContent"></div>
      <div class="dialog-actions"><button value="cancel" class="btn ghost">Cancelar</button><button id="confirmExecute" value="confirm" class="btn">Executar</button></div>
    </form>
  </dialog>
  <dialog id="resultDialog" class="result-dialog">
    <form method="dialog" class="dialog-card result-card">
      <div id="resultContent"></div>
      <div class="dialog-actions"><button value="close" class="btn">Fechar</button></div>
    </form>
  </dialog>
  <dialog id="cropDialog" class="crop-dialog">
    <form method="dialog" class="dialog-card crop-card">
      <div class="crop-heading"><div><small>RETRATO DO PERSONAGEM</small><h2>Ajustar foto</h2></div><p>Arraste a imagem e use o controle de zoom.</p></div>
      <div id="cropViewport" class="crop-viewport" aria-label="Área de recorte da fotografia">
        <img id="cropImage" alt="Prévia da fotografia para recorte" draggable="false">
        <span class="crop-guides" aria-hidden="true"></span>
      </div>
      <label class="crop-zoom"><span>Zoom</span><input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1"></label>
      <div class="dialog-actions"><button id="cancelCrop" value="cancel" class="btn ghost">Cancelar</button><button id="applyCrop" type="button" class="btn">Aplicar recorte</button></div>
    </form>
  </dialog>
  <script src="script.js?v=21"></script>
</body>
</html>
